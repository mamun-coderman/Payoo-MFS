<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <!-- outfit and sans font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awesome cdn -->
     <script src="https://kit.fontawesome.com/0a4b9bcbe6.js" crossorigin="anonymous"></script>

    <!-- daisy UI -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- tailwind added -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- tailwind config or customization css -->
    <script>
        tailwind.config = {
          theme: {
            extend: {
                fontFamily:{
                    primaryfont:['"Outfit", sans-serif']
                },
                colors:{
                    textColor: "#08080880"
                }
            }
          }
        }
    </script>
</head>
<body >
    <main class="box-border bg-[#f4f5f7] max-w-lg mx-auto pb-16">
        <!-- top section -->
         <div class="bg-white pb-6  rounded-b-3xl">
            <!-- This is top balance section -->
            <section class="border-b border-solid border-[#0808081a] p-2 flex justify-between items-center mx-auto px-10 my-2">
        
                <!-- This is logo and balance div -->
                <div class="flex items-center p-2">
                    <!-- logo div -->
                    <div>
                        <img src="./assets/Group.png" alt="" class="h-12 mr-1">
                    </div>
                    <!-- balance div -->
                    <div>
                        <h1 class="text-lg font-[primaryfont] font-bold">$<span id="displayed-balance">45000</span></h1>
                        <p class="text-[#08080880] font-normal font-[primaryfont] text-sm">Available Balance</p>
                    </div>
                </div>
            
                <!-- This is logout button div -->
                <div>
                    <button id="logout-btn" class="btn border border-solid border-      [#0808081a] p-3 text-[#08080880] font-normal font-[primaryfont]        text-sm rounded-lg ">
                        <i class="fa-solid fa-arrow-up-from-bracket -rotate-90"></i>Log Out
                    </button>
                </div>
            </section>
        
            <!-- this is welcome message section -->
            <section class="my-6 px-6">
                <h1 class="text-2xl font-[primaryfont] font-bold text-[#080808]">
                    🔥 Welcome to Payooo! 
                </h1>
            
                <p class="text-[#08080880] font-normal font-[primaryfont] text-base mt-3">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>
            </section>

            <!-- card section -->
            <section class="cards grid grid-cols-3 gap-4 px-6">
                <!-- add money card -->
                <div id="add-money" class="card-area flex flex-col gap-2 justify-center items-center border  border-solid border-[#0808081a] rounded-xl py-5 px-2.5">
                    <img src="./assets/wallet1.png" alt="">
                    <p class="text-[#080808b3] font-normal font-[primaryfont] text-sm">Add Money</p>
                </div>
                <!-- Cashout -->
                <div id="cash-out-card" class="card-area flex flex-col gap-2 justify-center items-center  border border-solid border-[#0808081a] rounded-xl py-5 px-2.5">
                    <img src="./assets/send1.png" alt="">
                    <p class="text-[#080808b3] font-normal font-[primaryfont] text-sm">Cashout</p>
                </div>
                <!-- Transfer Money -->
                <div id="transfer-money-card" class="card-area flex flex-col gap-2 justify-center items-center  border border-solid border-[#0808081a] rounded-xl py-5 px-2.5">
                    <img src="./assets/money1.png" alt="">
                    <p class="text-[#080808b3] font-normal font-[primaryfont] text-sm">Transfer Money</p>
                </div>
                <!-- Get Bonus -->
                <div id="get-bonus-card" class="card-area flex flex-col gap-2 justify-center items-center  border border-solid border-[#0808081a] rounded-xl py-5 px-2.5">
                    <img src="./assets/bonus1.png" alt="">
                    <p class="text-[#080808b3] font-normal font-[primaryfont] text-sm">Get Bonus</p>
                </div>
                <!-- Pay Bill -->
                <div id="pay-bill-card" class="card-area flex flex-col gap-2 justify-center items-center  border border-solid border-[#0808081a] rounded-xl py-5 px-2.5">
                    <img src="./assets/purse1.png" alt="">
                    <p class="text-[#080808b3] font-normal font-[primaryfont] text-sm">Pay Bill</p>
                </div>
                <!-- Transaction -->
                <div id="transaction-card" class="card-area flex flex-col gap-2 justify-center items-center  border border-solid border-[#0808081a] rounded-xl py-5 px-2.5">
                    <img src="./assets/transaction1.png" alt="">
                    <p class="text-[#080808b3] font-normal font-[primaryfont] text-sm">Transaction</p>
                </div>
            </section>
         </div>

         <!-- add money form section -->
        <section id="add-money-form" class="form-section mx-6 mt-8 hidden">
            <h2 class="text-lg font-[primaryfont] font-semibold text-[#080808] mb-4">Add Money</h2>
            <div class="flex flex-col  bg-[#fff] p-8 rounded-3xl ">
                <label for="" class="text-base font-medium font-primaryfont text-[#080808b3] ">Select A Bank</label>

                <select id="bank-select" class="select py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 mb-4 font-primaryfont w-full">
                    <option disabled selected>Select Bank</option>
                    <option>Islami Bank</option>
                    <option>AB Bank</option>
                    <option>Sonali Bank</option>
                </select>


                <label for="add-money-account-number" class="text-base font-medium font-primaryfont text-[#080808b3]">Bank Account Number</label>

                <input type="text" placeholder="Enter 11 digit account number" id="add-money-account-number" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 mb-4 font-primaryfont ">


                <label for="add-amount" class="text-base font-medium font-primaryfont text-[#080808b3] ">Amount to Add</label>

                <input type="text" placeholder="Add amount to withdraw" id="add-amount" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 mb-4 font-primaryfont ">


                <label for="pin-number" class="text-base font-medium font-primaryfont text-[#080808b3] ">Pin Number</label>
                <input type="password" placeholder="Enter 4 digit pin number" id="pin-number" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 font-primaryfont ">

                <br>

                <button id="add-money-btn" class="btn btn-block rounded-full bg-[#0874f2] text-[#fff] text-xl font-primaryfont ">Add Money</button>
            </div>
        </section>

        <!-- Cashout section -->
        <section id="cash-out-form" class="form-section mx-6 mt-8 hidden">
            <h2 class="text-lg font-[primaryfont] font-semibold text-[#080808] mb-4">Cash Out</h2>
            <div class="flex flex-col  bg-[#fff] p-8 rounded-3xl ">
                <label for="cash-out-agent-number" class="text-base font-medium font-primaryfont text-[#080808b3]">Agent Number</label>

                <input type="text" placeholder="Enter 11 digit number" id="cash-out-agent-number" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 mb-4 font-primaryfont ">


                <label for="" class="text-base font-medium font-primaryfont text-[#080808b3] ">Amount</label>

                <input type="text" placeholder="Enter amount to withdraw" id="" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 mb-4 font-primaryfont ">


                <label for="pin-number" class="text-base font-medium font-primaryfont text-[#080808b3] ">Pin Number</label>
                <input type="password" placeholder="Enter 4 digit pin number" id="pin-number" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 font-primaryfont ">

                <br>

                <button id="cash-out-btn" class="btn btn-block rounded-full bg-[#0874f2] text-[#fff] text-xl font-primaryfont ">withdraw Money</button>
            </div>
        </section>

        <!-- Transfer Money section -->
        <section id="transfer-money-form" class="form-section mx-6 mt-8 hidden">
            <h2 class="text-lg font-[primaryfont] font-semibold text-[#080808] mb-4">Transfer Money</h2>
            <div class="flex flex-col  bg-[#fff] p-8 rounded-3xl ">
                <label for="" class="text-base font-medium font-primaryfont text-[#080808b3]">User Account Number</label>

                <input type="text" placeholder="Enter 11 digit number" id="" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 mb-4 font-primaryfont ">


                <label for="" class="text-base font-medium font-primaryfont text-[#080808b3] ">Amount</label>

                <input type="text" placeholder="Enter amount to withdraw" id="" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 mb-4 font-primaryfont ">


                <label for="" class="text-base font-medium font-primaryfont text-[#080808b3] ">Pin Number</label>
                <input type="password" placeholder="Enter 4 digit pin number" id="" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 font-primaryfont ">

                <br>

                <button id="transfer-money-btn" class="btn btn-block rounded-full bg-[#0874f2] text-[#fff] text-xl font-primaryfont ">Send Now</button>
            </div>
        </section>

        <!-- Get Bonus section -->
        <section id="get-bonus-form" class="form-section mx-6 mt-8 hidden">
            <h2 class="text-lg font-[primaryfont] font-semibold text-[#080808] mb-4">Get Bonus</h2>
            <div class="flex flex-col  bg-[#fff] p-8 rounded-3xl ">
                <label for="" class="text-base font-medium font-primaryfont text-[#080808b3]">Enter Bonus Coupon</label>

                <input type="text" placeholder="Enter your coupon" id="" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 mb-4 font-primaryfont ">

                <br>

                <button id="" class="btn btn-block rounded-full bg-[#0874f2] text-[#fff] text-xl font-primaryfont ">Get Bonus</button>
            </div>
        </section>

        <!-- Pay Bill section -->
        <section id="pay-bill-form" class="form-section mx-6 mt-8 hidden">
            <h2 class="text-lg font-[primaryfont] font-semibold text-[#080808] mb-4">Pay Bill</h2>
            <div class="flex flex-col  bg-[#fff] p-8 rounded-3xl ">
                <label for="add-amount" class="text-base font-medium font-primaryfont text-[#080808b3] ">Select To Pay</label>

                <select class="select py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 mb-4 font-primaryfont w-full">
                    <option disabled selected>Select Payment</option>
                    <option>Electricity Bill</option>
                    <option>Land Tax</option>
                    <option>Income Tax</option>
                </select>


                <label for="" class="text-base font-medium font-primaryfont text-[#080808b3]">Biller Account Number</label>

                <input type="text" placeholder="Enter account number" id="" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 mb-4 font-primaryfont ">


                <label for="" class="text-base font-medium font-primaryfont text-[#080808b3] ">Amount to Pay</label>

                <input type="text" placeholder="Enter amount to pay" id="" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 mb-4 font-primaryfont ">


                <label for="pin-number" class="text-base font-medium font-primaryfont text-[#080808b3] ">Pin Number</label>
                <input type="password" placeholder="Enter 4 digit pin number" id="pin-number" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 font-primaryfont ">

                <br>

                <button id="pay-bill-btn" class="btn btn-block rounded-full bg-[#0874f2] text-[#fff] text-xl font-primaryfont ">Pay Now</button>
            </div>
        </section>

        <!-- transaction history section added -->
        <section id="transaction-form" class="form-section mx-6 mt-8 hidden">
            <div>
                <h2 class="text-lg font-[primaryfont] font-semibold text-[#080808] mb-4">Transaction History</h2>
            </div>
            
        </section>
    </main>


    <script src="./js/home.js"></script>
</body>
</html>
