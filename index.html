<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo-MFS</title>

    <!-- outfit and sans font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- daisy UI -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- tailwind added -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- tailwind config or customization css -->
    <script>
        tailwind.config = {
          theme: {
            extend: {
                fontFamily:{
                    primaryfont:['"Outfit", sans-serif']
                }
            }
          }
        }
    </script>

    
</head>
<body class=" bg-[#f4f5f7] min-h-screen flex flex-col justify-center items-center px-6">
    <div ></div>
    <form class="flex flex-col  bg-[#fff] p-8 rounded-3xl w-full max-w-sm ">
        <label for="mobile-number" class="text-base font-medium font-primaryfont text-[#080808]">Mobile Number</label>

        <input type="text" placeholder="Enter your mobile number" id="mobile-number" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 mb-4 font-primaryfont ">

        <label for="pin-number" class="text-base font-medium font-primaryfont text-[#080808] ">4 Digit Pin</label>

        <input type="password" placeholder="Enter 4 Digit Pin" id="pin-number" class="py-2 px-5 rounded-full bg-[#f4f5f7] border-0 mt-3 font-primaryfont ">

        <br>

        <button id="login-btn" class="btn btn-block rounded-full bg-[#0874f2] text-[#fff] text-xl font-primaryfont ">Login</button>
    </form>



    <script src="js/login.js"></script>
</body>
</html>
